<div class="fixed inset-0 z-20 flex cursor-pointer items-start justify-center bg-black/60 px-4 py-16" (click)="cancelled.emit()">
  <div class="w-full max-w-lg cursor-auto rounded-md border border-line bg-surface p-5 shadow-xl" (click)="$event.stopPropagation()">
    <h2 class="text-lg font-semibold">Download before continuing</h2>
    <p class="mt-1 text-sm text-faint">Hotbar will not download anything until you agree.</p>
    <ul class="mt-4 grid gap-3">
      @for (item of items(); track item.id) {
        <li class="rounded border border-line bg-canvas px-3 py-2">
          <p class="text-sm font-medium">{{ item.title }}</p>
          <p class="mt-1 text-sm text-faint">{{ item.detail }}</p>
        </li>
      }
    </ul>
    <div class="mt-5 flex justify-end gap-2">
      <button type="button" class="h-9 rounded px-3 text-sm text-faint" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="h-9 rounded bg-accent px-3 text-sm text-white" (click)="agreed.emit()">Download</button>
    </div>
  </div>
</div>
