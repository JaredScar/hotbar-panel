<section class="mx-auto w-full max-w-md px-6 py-10">
  <a routerLink="/" class="text-sm text-faint no-underline hover:text-ink">Back to this machine</a>
  <h1 class="mt-3 text-xl font-semibold">{{ creating() ? 'Create a panel account' : 'Panel sign in' }}</h1>
  <p class="mt-1 text-sm text-faint">The panel is optional. Servers keep running on the machine that hosts them.</p>

  <form class="mt-5 grid gap-3" (submit)="submit($event)">
    <label class="text-sm">
      <span class="text-faint">Panel URL</span>
      <input class="mt-1 h-9 w-full rounded border border-line bg-canvas px-2" [value]="url()" (input)="url.set($any($event.target).value)" />
    </label>
    <label class="text-sm">
      <span class="text-faint">Email</span>
      <input class="mt-1 h-9 w-full rounded border border-line bg-canvas px-2" type="email" autocomplete="username" [value]="email()" (input)="email.set($any($event.target).value)" />
    </label>
    <label class="text-sm">
      <span class="text-faint">Password</span>
      <input class="mt-1 h-9 w-full rounded border border-line bg-canvas px-2" type="password" autocomplete="current-password" [value]="password()" (input)="password.set($any($event.target).value)" />
    </label>
    @if (!creating()) {
      <label class="text-sm">
        <span class="text-faint">Authenticator code</span>
        <input class="mt-1 h-9 w-full rounded border border-line bg-canvas px-2" inputmode="numeric" [value]="code()" (input)="code.set($any($event.target).value)" />
      </label>
    }
    @if (error()) {
      <p class="text-sm text-danger">{{ error() }}</p>
    }
    <button type="submit" class="h-9 rounded bg-accent text-sm font-medium text-white disabled:opacity-40" [disabled]="busy()">
      {{ creating() ? 'Create account' : 'Sign in' }}
    </button>
  </form>

  <button type="button" class="mt-4 text-sm text-accent" [disabled]="busy()" (click)="usePasskey()">Sign in with a passkey</button>
  <button type="button" class="mt-4 ml-4 text-sm text-accent" (click)="creating.set(!creating())">
    {{ creating() ? 'I already have an account' : 'Create an account' }}
  </button>
</section>
